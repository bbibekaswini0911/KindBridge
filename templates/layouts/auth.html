{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KindBridge{% endblock %}</title>
  <script>try{var t=localStorage.getItem('kb-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;700&family=Noto+Sans+Oriya:wght@700&display=swap">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}?v=2">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=2">
  {% block extra_css %}{% endblock %}
</head>
<body class="auth-body">
  <header class="auth-top">
    <a class="auth-brand" href="{% url 'home' %}"><span class="mark">&#9829;</span><span>Kind<b>Bridge</b></span></a>
    <button class="theme-btn" type="button" data-theme-toggle aria-label="Switch light or dark mode">
      <svg class="ic ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="toast-area" id="toastArea" aria-live="polite">
    {% for message in messages %}
      <div class="toast {{ message.tags }}">
        <span>{{ message }}</span>
        <button type="button" class="toast-close" aria-label="Close">&times;</button>
      </div>
    {% endfor %}
  </div>

  <main class="auth-main">{% block content %}{% endblock %}</main>

  <script src="{% static 'js/popup.js' %}"></script>
  <script src="{% static 'js/theme.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
